 <style type="text/css">
/* -------------------------------------
  Email template: email_styles
  Description: Adapted CSS for email templates to follow receipt layout styling, compatible with email_header.
------------------------------------- */

/* -------------------------------------
  GLOBAL
------------------------------------- */
body {
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  background-color: #f5f5f5;
  margin: 0;
  padding: 20px;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: none;
  font-size: 100%;
  line-height: 1.6;
}

img {
  max-width: 100%;
  height: auto;
  display: block;
}

.rounded-gravatar {
  border-radius: 30px;
  margin-top: -5px;
}

.aligned-user {
  position: relative;
  clear: both;
}

.condensed-users {
  margin-left: 120px;
  margin-right: 120px;
}

.clear-elements {
  clear: both;
}

.margin-left-10 {
  margin-left: 10px;
}

/* -------------------------------------
  WRAPPER
------------------------------------- */
.table-wrapper, .table-wrapper-branding, .legal-wrapper {
  width: 700px;
  margin: auto;
  background-color: #ffffff;
  box-shadow: 0 0 15px rgba(0,0,0,0.1);
}

.table-wrapper {
  margin-top: 20px;
  border: 20px solid #92140C; /* Red border from receipt */
  border-radius: 10px;
  padding: 20px;
}

.table-wrapper-branding {
  margin-top: 15px;
  background-color: #ffffff;
  border: 1px solid #BDBDBD;
  border-radius: 4px;
  height: 42px;
  box-shadow: 0 0 15px rgba(0,0,0,0.1);
}

/* -------------------------------------
  RECEIPT STYLING (Adapted from second code)
------------------------------------- */
.data-table {
  width: 100%;
  max-width: 350px; /* Match receipt width */
  margin: auto;
  margin-bottom: 30px;
  border: 20px solid #92140C; /* Red border from receipt */
  padding: 15px;
  background-color: #ffffff;
}

.data-table td {
  color: #333;
  font-size: 0.95rem; /* Match receipt-details font size */
  padding: 10px;
  border-bottom: 1px dashed #333; /* Match hr style */
}

.data-table .total td, .data-table .total td.text-right {
  background: #f7f7f7;
  border: 0;
  color: #333;
  font-weight: bold;
}

.data-table td.text-right {
  text-align: right;
}

.data-table td a {
  color: {{ email_settings.brand_secondary }};
}

h1.price-jumbo {
  text-align: center;
  font-weight: bold; /* Match receipt h2 bold */
  font-style: italic; /* Match receipt h2 */
  font-size: 28px;
  margin: 0;
}

.quote {
  font-style: italic;
  text-align: center;
  font-size: 0.85rem;
  margin: 10px 0;
  color: #47505E;
}

/* -------------------------------------
  ELEMENTS
------------------------------------- */
p a {
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  color: {{ email_settings.brand_secondary }};
}

.btn-primary {
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  text-decoration: none;
  color: #FFF;
  background-color: {{ email_settings.brand_secondary }};
  border: solid {{ email_settings.brand_secondary }};
  line-height: 2;
  max-width: 100%;
  font-size: 14px;
  padding: 8px 40px;
  margin: 30px auto;
  text-align: center;
  font-weight: 600;
  display: inline-block;
  border-radius: 30px;
}

/* -------------------------------------
  BODY
------------------------------------- */
table.body-wrap {
  width: 100%;
  padding: 30px 55px;
  background: #f5f5f5;
  margin: 0;
  font-size: 15px;
  line-height: 1.8;
}

.container {
  margin: 0 auto;
  clear: both;
  text-align: center; /* Ensure centered content for header */
}

/* -------------------------------------
  HEADER (Styled to match email_header and receipt)
------------------------------------- */
.header {
  background-color: #92140C; /* Match header's inline style and receipt border */
  border-top-left-radius: 10px;
  border-top-right-radius: 10px;
  padding: 20px 0; /* Match header's inline padding */
  text-align: center;
  color: #f5f5f5; /* Match header's span color */
}

.header img {
  border-radius: 50%;
  margin-right: 12px; /* Match header's inline style */
  height: 64px;
  width: 64px;
}

.header span {
  font-family: "Segoe UI", Roboto, sans-serif; /* Match header's inline style */
  font-size: 20px;
  font-weight: 600;
  color: #f5f5f5;
  vertical-align: middle;
  padding-left: 10px;
}

.header-title {
  background: #92140C; /* Match header background */
  color: #f5f5f5; /* Match header text color */
  padding: 0 20px 20px;
  text-align: center;
  {% if email_settings.brand_primary == "#ffffff" %}
    padding-bottom: 0px;
  {% endif %}
  margin-bottom: 20px;
}

.header-title h1, .header-title h1 a {
  font-size: 28px;
  line-height: 40px;
  padding-top: 0;
  margin-bottom: 10px;
  font-weight: bold; /* Match receipt h2 */
  font-style: italic; /* Match receipt h2 */
  color: #f5f5f5; /* Match header text */
}

.header-school-title {
  font-weight: normal; /* Match receipt h3 */
}

.header-title p, .header-title p a {
  color: #f5f5f5;
  opacity: 0.8;
  font-size: 0.95rem; /* Match receipt-details */
}

.header-margin-overide {
  margin-top: -20px;
}

/* -------------------------------------
  CONTENT
------------------------------------- */
.content {
  margin: 0 auto;
  clear: both;
  background: #fff;
  border-bottom-left-radius: 10px;
  border-bottom-right-radius: 10px;
  padding-bottom: 40px;
}

.content p, .content h1, .content h2, .content h3, .content table, .content hr {
  padding-left: 40px;
  padding-right: 40px;
}

.content p:first-child, .content h1 {
  padding-top: 40px;
}

.content p:last-child {
  margin-bottom: 0;
  padding-bottom: 0;
}

.condensed-width {
  max-width: 510px;
  margin: auto;
}

.table-container {
  text-align: center;
}

.content-bordered {
  padding: 24px;
  border: 1px solid #EFEFF5;
}

.content-bordered tr {
  margin: 24px 0;
}

span .left {
  float: left;
}

span .right {
  float: right;
}

/* -------------------------------------
  FOOTER
------------------------------------- */
.footer {
  padding: 30px 0 55px;
  width: 100%;
  clear: both;
  text-align: center;
}

.footer p {
  font-size: 12px;
  color: #666;
}

.footer a {
  color: #999;
}

.footer .social-icons {
  padding-top: 5px;
}

/* -------------------------------------
  TYPOGRAPHY
------------------------------------- */
a {
  color: {{ email_settings.brand_secondary }};
  word-wrap: break-word;
}

h1, h2, h3 {
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  line-height: 1.1;
  margin-bottom: 15px;
  color: #47505E;
  margin: 0 0 10px;
  font-weight: bold;
}

.bold {
  font-weight: bold;
}

.text-center {
  text-align: center;
}

.text-right {
  text-align: right;
}

.left {
  float: left;
}

.right {
  float: right;
}

.small {
  font-size: 80%;
  line-height: 250%;
  vertical-align: middle;
}

.margin-none {
  margin: 0 !important;
}

.padding-none {
  padding: 0 !important;
}

h1 {
  font-size: 28px;
  line-height: 45px;
  margin-bottom: 30px;
}

h2 {
  font-size: 24px;
  margin-bottom: 20px;
}

h3 {
  font-size: 22px;
  margin-bottom: 20px;
}

p, ul, ol {
  font-weight: normal;
  padding: 0;
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  line-height: 1.7;
  margin-bottom: 1.3em;
  font-size: 0.95rem; /* Match receipt-details */
  color: #47505E;
}

p:first-child {
  margin-top: 0;
}

ul li, ol li {
  margin-left: 50px;
  list-style-position: inside;
}

hr {
  border: none;
  border-top: 1px dashed #333; /* Match receipt hr */
}

/* Unsubscribe Link */
a.unsubscribe-link {
  font-size: 12px;
  margin-top: 50px;
  display: block;
  text-align: center;
  text-decoration: underline;
}

/* Branding Link */
a.branding-link {
  display: block;
  text-align: center;
  text-decoration: none;
}

/* Branding Image */
img.branding-image {
  border: 0;
  height: auto;
  line-height: 100%;
  outline: none;
  max-width: 178px;
  width: 60px;
  height: 11px;
  margin-top: 4px;
}

/* Legal Text */
p.legal-text {
  font-size: 12px;
  margin-top: 50px;
}

/* -------------------------------------
  TAX FORMS
------------------------------------- */
.tax-form-box {
  border: 2px solid #808080;
  border-radius: 10px;
  margin: 0 40px;
  padding-top: 20px;
  height: 45px;
  text-align: center;
  color: #44443f;
}

/* -------------------------------------
  FREE TRIAL ORDER SUMMARY
------------------------------------- */
.free-trial-summary p, .free-trial-summary .small-text {
  font-size: 12px;
  line-height: 19px;
  color: #333;
}

.free-trial-summary p a {
  color: #20BDAF;
  text-decoration: none;
}

.free-trial-summary table {
  font-size: 14px;
  line-height: 21px;
  border-collapse: collapse;
  width: 100%;
}

.free-trial-summary table td {
  padding: 5px 0;
}

.free-trial-summary .heading {
  font-size: 16px;
  line-height: 24px;
  padding-top: 10px;
}

.free-trial-summary .gray {
  color: #6B6D7C;
}

.free-trial-summary .border-row {
  border-top: 1px solid #EFEFF5;
}

.free-trial-summary .content-bordered {
  width: 100%;
  border-radius: 4px;
}

/* -------------------------------------
  LEGACY STUFF
------------------------------------- */
.content h1.headline:first-child, .content h2.headline:first-child {
  padding-top: 40px;
}

.content h2.subline {
  font-weight: 300;
  font-size: 20px;
}

.invoice {
  margin: 20px auto;
  text-align: left;
  width: 80%;
}

.invoice td {
  padding: 15px 10px;
  font-size: 110%;
  line-height: 125%;
}

.invoice .invoice-details {
  font-size: 19px;
}

.invoice .invoice-items {
  width: 100%;
}

.invoice .invoice-items td {
  border-top: 1px dashed #333;
}

.invoice .invoice-items .total td {
  border-top: 2px solid #333;
  border-bottom: 2px solid #333;
  font-weight: bold;
}

.alignright {
  text-align: right;
}

.personal-details {
  margin: 0 auto;
  text-align: left;
  width: 80%;
}

.personal-details td {
  padding: 15px 10px;
  font-size: 100%;
  line-height: 125%;
}

.personal-details .detail-items {
  width: 100%;
}

.personal-details .detail-items tr:first-child td {
  border-top: 1px dashed #333;
}

.personal-details .detail-items td {
  border-bottom: 1px dashed #333;
}

.personal-details .detail-items .stripe {
  background: #fcfcfc;
}

.personal-details .detail-items .alignleft {
  font-weight: bold;
}

.personal-details .detail-items .alignright {
  border-left: 1px solid #333;
  padding-left: 20px;
}

/* -------------------------------------
  INTAKE FORM EMAILS
------------------------------------- */
.intake__response-header {
  padding-left: 40px;
  margin-top: 48px;
}

.intake__question {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: -14px;
}

.intake__answer {
  font-size: 14px;
}

/* -------------------------------------
  MODERATE/NEW COMMENT
------------------------------------- */
.header-title .comment-title {
  font-size: 20px;
  font-style: normal;
  font-weight: 600;
  line-height: 24px;
}

.comment-link {
  color: #333;
  font-size: 14.2222px;
  line-height: 21px;
  margin: 16px 0;
}

.comment-link a {
  color: inherit;
  text-decoration-line: underline;
}

.comment-author {
  color: #333;
  font-size: 14.2222px;
  line-height: 21px;
  margin-bottom: 0;
  margin-top: 12px;
}

.comment-date {
  color: #717171;
  font-size: 12.642px;
  line-height: 19px;
  margin-bottom: 16px;
  margin-top: 0;
}

.separator {
  border: 0.5px solid #E3E3E3;
  margin: 0 40px;
}

.comment-content {
  margin-top: 0;
}

.comment-content p.comment-content--body {
  color: #333;
  font-size: 14.2222px;
  line-height: 21px;
  padding-left: 0;
  padding-top: 0;
}

.comment-action-container {
  margin-bottom: 16px;
}

.comment-action-container--button {
  background-color: #333;
  border: solid;
  border-radius: 6px;
  color: #FFFFFF;
  display: inline-block;
  font-size: 14.2222px;
  font-weight: bold;
  line-height: 21px;
  padding: 4px 16px;
  text-align: center;
  text-decoration: none;
}

.comment-author--re {
  font-weight: bold;
  margin-left: 8px;
}

.content.new_lecture_comment,
.content.moderate_lecture_comment {
  background-color: #FAFAFA;
}

/* -------------------------------------
  RESPONSIVENESS
------------------------------------- */
@media only screen and (max-device-width: 700px) {
  .table-wrapper, .legal-wrapper {
    width: 100% !important;
    margin-top: 0 !important;
    border-radius: 0 !important;
  }

  .data-table {
    width: 100% !important;
    margin: 0 !important;
    border-width: 10px !important;
  }

  .header {
    border-radius: 0 !important;
  }

  .header-title {
    padding-left: 20px !important;
    padding-right: 20px !important;
  }

  .header-title h1 {
    font-size: 25px !important;
  }
}
</style>

<!--
Email template: student/certificate_issued_notification
Description: This email is sent to a student when they are issued a certificate for completing a course.
 -->

<!-- Email Title -->
<div class="header-title">
  <h1>You have been issued a certificate!</h1>
</div>

<!-- Content -->
<p class="text-center">
  <p>{{school.name}} has issued a certificate to you for completing {{ course.name }}.</p>
  <p><a href="{{course.url}}/certificate">View your certificate.</a></p>
</p>

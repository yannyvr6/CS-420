<!--
Email template: subscription_canceled_manually
Description: This email is sent to instructors when a student cancels their subscription manually.
 -->

<!-- Email Title -->
<div class="header-title">
    <h1>Student cancellation</h1>
  </div>
  
  <!-- Content -->
  <p>We're letting you know that <a href="{{student.admin_url}}">{{ student.name }}</a> canceled their subscription to {{ purchased_item.name }}.</p>
